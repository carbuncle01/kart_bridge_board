<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520"
     viewBox="0 0 900 520" role="img"
     aria-labelledby="title description">
  <title id="title">JPBB-01 Rev.2 表面テストポイント配置図</title>
  <desc id="description">
    部品面を上、USB-Cを左下にした基板表面図。無通電試験で使う
    TP1 VBEC、TP2 3.3V、TP3 GNDを強調している。
  </desc>

  <defs>
    <style>
      text {
        font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic",
                     sans-serif;
        fill: #17202a;
      }
      .board-label {
        fill: #ecf8ef;
        font-size: 13px;
        font-weight: 700;
      }
      .small {
        font-size: 12px;
      }
      .ref {
        font-size: 13px;
        font-weight: 700;
      }
      .callout {
        font-size: 16px;
        font-weight: 700;
      }
      .sub {
        font-size: 13px;
      }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4"
                    flood-color="#17202a" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10"
            refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2471a3"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10"
            refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d35400"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10"
            refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#f7f9fb"/>
  <text x="450" y="32" text-anchor="middle" font-size="23"
        font-weight="700">JPBB-01 Rev.2 表面テストポイント配置図</text>
  <text x="450" y="56" text-anchor="middle" font-size="14">
    部品面を上にして、USB-Cが左下になる向き
  </text>

  <!-- The 60 x 30 mm board is drawn at 10 px/mm, origin (150, 100). -->
  <g id="board" filter="url(#shadow)">
    <rect x="150" y="100" width="600" height="300" rx="4"
          fill="#176b3a" stroke="#0b3d22" stroke-width="4"/>

    <!-- Unpopulated 2.54 mm headers. -->
    <g fill="#d7dce0" stroke="#273746" stroke-width="2">
      <rect x="185" y="108" width="50" height="30" rx="3"/>
      <rect x="305" y="108" width="50" height="30" rx="3"/>
      <rect x="635" y="108" width="50" height="30" rx="3"/>
      <rect x="655" y="295" width="50" height="30" rx="3"/>
      <rect x="655" y="345" width="50" height="30" rx="3"/>
    </g>
    <g fill="#6b4f2b">
      <circle cx="197" cy="123" r="5"/><circle cx="210" cy="123" r="5"/>
      <circle cx="223" cy="123" r="5"/>
      <circle cx="317" cy="123" r="5"/><circle cx="330" cy="123" r="5"/>
      <circle cx="343" cy="123" r="5"/>
      <circle cx="647" cy="123" r="5"/><circle cx="660" cy="123" r="5"/>
      <circle cx="673" cy="123" r="5"/>
      <circle cx="667" cy="310" r="5"/><circle cx="680" cy="310" r="5"/>
      <circle cx="693" cy="310" r="5"/>
      <circle cx="667" cy="360" r="5"/><circle cx="680" cy="360" r="5"/>
      <circle cx="693" cy="360" r="5"/>
    </g>

    <!-- Main recognizable parts. -->
    <rect x="158" y="342" width="92" height="48" rx="5"
          fill="#bcc6cc" stroke="#273746" stroke-width="2"/>
    <rect x="150" y="354" width="30" height="24"
          fill="#6d7880" stroke="#273746" stroke-width="2"/>
    <text x="202" y="371" text-anchor="middle" class="ref">J6 USB-C</text>

    <rect x="427" y="198" width="86" height="104" rx="3"
          fill="#1b2631" stroke="#d5d8dc" stroke-width="2"/>
    <g fill="#d5d8dc">
      <circle cx="445" cy="218" r="4"/><circle cx="495" cy="218" r="4"/>
      <circle cx="445" cy="234" r="4"/><circle cx="495" cy="234" r="4"/>
      <circle cx="445" cy="250" r="4"/>
      <circle cx="445" cy="266" r="4"/><circle cx="495" cy="266" r="4"/>
      <circle cx="445" cy="282" r="4"/><circle cx="495" cy="282" r="4"/>
    </g>
    <path d="M 492 292 l 8 0 l -4 -8 z" fill="#f4d03f"/>
    <text x="470" y="321" text-anchor="middle" class="board-label">J7 SWD</text>

    <circle cx="183" cy="230" r="20" fill="#2c3e50"
            stroke="#d5d8dc" stroke-width="3"/>
    <circle cx="710" cy="175" r="20" fill="#2c3e50"
            stroke="#d5d8dc" stroke-width="3"/>
    <text x="183" y="265" text-anchor="middle" class="board-label">SW1 RST</text>
    <text x="710" y="210" text-anchor="middle" class="board-label">SW2 BOOT</text>

    <rect x="285" y="215" width="70" height="70" rx="5"
          fill="#222" stroke="#ccd1d1" stroke-width="2"/>
    <text x="320" y="255" text-anchor="middle" class="board-label">U1</text>
    <text x="320" y="272" text-anchor="middle" class="board-label">MCU</text>
    <rect x="610" y="220" width="72" height="55" rx="4"
          fill="#222" stroke="#ccd1d1" stroke-width="2"/>
    <text x="646" y="253" text-anchor="middle" class="board-label">U2 MUX</text>

    <text x="210" y="153" text-anchor="middle" class="board-label">J1 RX1</text>
    <text x="330" y="153" text-anchor="middle" class="board-label">J2 RX2</text>
    <text x="660" y="153" text-anchor="middle" class="board-label">J3 RX3</text>
    <text x="640" y="315" text-anchor="end" class="board-label">J4 SERVO</text>
    <text x="640" y="365" text-anchor="end" class="board-label">J5 ESC/BEC</text>

    <!-- Test pads, placed from the KiCad PCB coordinates. -->
    <g stroke="#fff" stroke-width="2">
      <circle cx="185" cy="124" r="8" fill="#95a5a6"/>
      <circle cx="305" cy="124" r="8" fill="#95a5a6"/>
      <circle cx="635" cy="124" r="8" fill="#95a5a6"/>
      <circle cx="735" cy="280" r="8" fill="#95a5a6"/>
      <circle cx="680" cy="385" r="8" fill="#95a5a6"/>

      <circle cx="640" cy="385" r="11" fill="#c0392b"/>
      <circle cx="440" cy="385" r="11" fill="#d35400"/>
      <circle cx="330" cy="385" r="11" fill="#2471a3"/>
    </g>

    <g class="board-label">
      <text x="173" y="105">TP4</text>
      <text x="293" y="105">TP5</text>
      <text x="623" y="105">TP6</text>
      <text x="705" y="275">TP7</text>
      <text x="675" y="370">TP8</text>
    </g>

    <text x="450" y="190" text-anchor="middle" fill="#d5f5e3"
          font-size="18" font-weight="700">JPBB-01 Rev.2 — TOP VIEW</text>
  </g>

  <!-- Callouts for the three points used during first power inspection. -->
  <path d="M 218 452 C 255 438, 300 425, 330 385"
        fill="none" stroke="#2471a3" stroke-width="3"
        marker-end="url(#arrow-blue)"/>
  <rect x="25" y="438" width="195" height="58" rx="8"
        fill="#eaf2f8" stroke="#2471a3" stroke-width="2"/>
  <text x="40" y="462" class="callout" fill="#2471a3">TP3 — GND</text>
  <text x="40" y="484" class="sub">黒リードの基準点</text>

  <path d="M 458 445 C 454 432, 450 420, 440 385"
        fill="none" stroke="#d35400" stroke-width="3"
        marker-end="url(#arrow-orange)"/>
  <rect x="350" y="438" width="220" height="58" rx="8"
        fill="#fdf2e9" stroke="#d35400" stroke-width="2"/>
  <text x="365" y="462" class="callout" fill="#d35400">TP2 — +3V3</text>
  <text x="365" y="484" class="sub">USB給電時：約3.3 V</text>

  <path d="M 730 450 C 696 434, 662 418, 640 385"
        fill="none" stroke="#c0392b" stroke-width="3"
        marker-end="url(#arrow-red)"/>
  <rect x="680" y="438" width="195" height="58" rx="8"
        fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="695" y="462" class="callout" fill="#c0392b">TP1 — VBEC</text>
  <text x="695" y="484" class="sub">USBのみでは0 V付近</text>

  <text x="450" y="515" text-anchor="middle" class="small">
    赤・橙・青の丸が実際の直径1.0 mmテストパッド位置。図はKiCad PCB座標に基づく。
  </text>
</svg>
